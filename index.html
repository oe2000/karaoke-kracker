<script>

function mq(){return new Promise((ok,no)=>{let i=0;const t=()=>{if(i>=BR.length)return no('no broker reachable');const c=mqtt.connect(BR[i++],{reconnectPeriod:0});let d=0;
 const f=()=>{if(d++)return;clearTimeout(h);c.end(true);t()},h=setTimeout(f,7000);c.once('connect',()=>{if(d++)return c.end(true);clearTimeout(h);c.options.reconnectPeriod=3000;ok(c)});c.on('error',f)};t()})}
let mc=null,mode='duel',tol=1.5,lib=[],cur=null,sel={},grace=.5,ct=0,en=new Set(),lsel=new Set(),oc={a:[0,0],b:[0,0]},strict=false,mr=null,code='',slot=0,pm=null,G=null,
pl=[0,1,2,3].map(()=>({m:null,seen:0,hb:-1e9,combo:0,hold:0,len:0,bar:0,fx:null,fr:0,cd:[0,0,0],on:false}));
const fold=d=>((d%12)+18)%12-6, team=p=>mode=='party'?p>>1:p, tn=t=>mode=='party'?'TEAM '+(t+1):'P'+(t+1);
// ---- attack bar ----
// segs per bar, bars a flawless run earns, combo cap (for bar fill AND passive scoring), drain speed (segs/s), payout (points) by filled segments,
// points a flawless run moves the score bar passively, score bar's visual half-range around 50 (score itself is never clamped)
const BUILD='2026-10-04 copy/paste v3';
const BAR={segs:3,bars:2.5,cap:30,drain:3,pay:[0,2.5,7,16],pass:40,span:75},
// total 'fill-weight' of a flawless (never-broken) run of D seconds of singing; combo +1 per 0.2s of hitting
pf=D=>{let s=0,k=0;for(;D>.2;D-=.2,k++)s+=.2*(1+.1*Math.min(k,BAR.cap));return s+D*(1+.1*Math.min(k,BAR.cap))};
// ---- pitch detection (autocorrelation on decimated signal) ----
function pitch(x,sr){const d=Math.max(1,Math.round(sr/12000)),n=Math.floor(x.length/d),y=new Float32Array(n);let e=0;
 for(let i=0;i<n;i++){let s=0;for(let k=0;k<d;k++)s+=x[i*d+k];y[i]=s/d;e+=y[i]*y[i]}
 if(e/n<1e-5)return null;
 const r=sr/d,lo=Math.floor(r/800),hi=Math.min(Math.floor(r/80),n>>1),c=[];let mx=0;
 for(let L=lo;L<=hi;L++){let s=0,a=0,b=0;for(let i=0;i<n-L;i++){s+=y[i]*y[i+L];a+=y[i]*y[i];b+=y[i+L]*y[i+L]}c[L]=s/Math.sqrt(a*b+1e-9);if(c[L]>mx)mx=c[L]}
 if(mx<.6)return null;
 for(let L=lo+1;L<hi;L++)if(c[L]>=.9*mx&&c[L]>=c[L-1]&&c[L]>=c[L+1])return 69+12*Math.log2(r/L/440);
 return null}
// ---- screens ----
const fo=v=>(v>0?'+':'')+v,PPS=100,PH=6,LO=36,HI=84,NY=(HI-LO+1)*PH,nat=(tk,t)=>{for(const n of tk.n)if(t>=n.s&&t<n.s+n.d)return n.m;return null};
const DB=new Promise(r=>{const q=indexedDB.open('kk',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>r(q.result)});
const db=async(m,a)=>{const d=await DB;return new Promise(r=>{const q=d.transaction('s',m=='getAll'?'readonly':'readwrite').objectStore('s')[m](a);q.onsuccess=()=>r(q.result)})};
const lrcP=t=>t.split('\n').map(l=>l.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/)).filter(Boolean).map(m=>({t:+m[1]*60+ +m[2],x:m[3].trim()}));
function home(){app.innerHTML=`<div class=w><h1>KARAOKE<span> KRACKER</span></h1><p class=d>// sing to hack. sing to win.</p><button id=hh class=go>HOST DEVICE</button><button id=pp class=go>JOIN AS PLAYER (PHONE OR PC)</button></div>`}
const MD={duel:'2 rounds. P1 sings a solo song, then P2 sings a solo song.',clash:'1 round. One duo song: P1 sings track 1, P2 sings track 2, at the same time.',party:'4 players, 2 rounds. Team 1 (P1+P2) then Team 2 (P3+P4) each duet a duo song.'};
function setup(){const k=mode=='duel'?'solo':'duo',L=lib.filter(s=>s.kind==k),two=mode!='clash';
 if(!L.some(s=>s.id==sel.a))sel.a=L[0]&&L[0].id;if(!L.some(s=>s.id==sel.b))sel.b=(L[1]||L[0]||{}).id;
 const pick=(w)=>`<label><select data-sel=${w}>${L.map(s=>`<option value="${s.id}" ${sel[w]==s.id?'selected':''}>${s.name.replace(/</g,'&lt;')}</option>`).join('')}</select></label> `;
 const sl=(w,k,l)=>`<label style="display:inline-block;min-width:220px;margin-right:12px">${l} octave <b>${fo(oc[w][k])}</b><input type=range data-oc="${w},${k}" min=-2 max=2 step=1 value=${oc[w][k]}></label>`,
 slot=(w,t,ks)=>`<div class=tk><b>${t}</b> ${pick(w)}<div>${ks.map(([k,l])=>sl(w,k,l)).join('')}</div></div>`,
 slots=()=>mode=='duel'?slot('a','Song 1 (P1)',[[0,'P1']])+slot('b','Song 2 (P2)',[[0,'P2']]):mode=='clash'?slot('a','Song',[[0,'P1 vocal'],[1,'P2 vocal']]):slot('a','Song 1 (Team 1)',[[0,'P1'],[1,'P2']])+slot('b','Song 2 (Team 2)',[[0,'P3'],[1,'P4']]);
 app.innerHTML=`<div class=w><h1>KARAOKE<span> KRACKER</span></h1><p class=d>// host terminal (Space = start, F = fullscreen)</p>
<h3>MODE</h3><div class=row>${['duel','clash','party'].map(m=>`<button data-m=${m} class="${mode==m?'on':''}">${m.toUpperCase()}</button>`).join('')}</div><p class=d>${MD[mode]}</p>
<h3>SONGS (${k} songs)</h3>${L.length?slots():'<p class=e>No '+k+' songs yet. Open the song editor.</p>'}<p><button id=le>SONG EDITOR</button></p>
<h3>DEFAULT PITCH LENIENCY: ±<b id=tv>${tol}</b> semitones</h3><input type=range id=tl min=.5 max=4 step=.25 value=${tol}>
<h3>BREAK TOLERANCE: <b id=gv>${grace}</b> s</h3><p class=d>Once a player hits the pitch, they aren't re-checked for this long. Hitting it again resets the timer.</p><input type=range id=gr min=0 max=3 step=.1 value=${grace}>
<h3>SCORING</h3><label><input type=checkbox id=sx style="width:auto" ${strict?'checked':''}> Octave-strict (off = singing a note in ANY octave counts, so the octave sliders only move the notes on screen)</label>
<h3>LOBBY :: phones join code <b style="font-size:26px;color:#fff">${code}</b></h3><div id=sl></div><p><button id=st class=go>&gt; INITIATE BREACH</button></p><p id=er class=e></p></div>`}
function library(){app.innerHTML=`<div class=w><h1>SONG EDITOR</h1><div class=row><button data-new=solo>+ NEW SOLO</button><button data-new=duo>+ NEW DUO</button><button id=dm>ADD DEMO SONGS</button><button id=exa>EXPORT ALL</button><button id=imb>IMPORT</button><input type=file id=im accept=".json,application/json" hidden><button id=bk>BACK</button><span id=ims class=d></span></div>
${['solo','duo'].map(k=>`<h3>${k.toUpperCase()} SONGS ${k=='solo'?'(Duel)':'(Clash / Party)'}</h3>${lib.filter(s=>s.kind==k).map(s=>`<div class=row><b style="flex:1">${s.name.replace(/</g,'&lt;')}</b><button data-ed="${s.id}">EDIT</button><button data-ex="${s.id}">EXPORT</button><button data-rm="${s.id}">DELETE</button></div>`).join('')||'<p class=d>none yet</p>'}`).join('')}<p class=d>Songs are saved in this browser (IndexedDB) on this device and URL. Use EXPORT to back them up (melody audio included) or move them to another device or website, and IMPORT to load them back.</p></div>`}
async function demo(){const sc=[60,62,64,65,67,65,64,62],A=[...Array(32)].map((_,i)=>({s:1+i,d:.8,m:sc[i%8]+(i%16>7?5:0)})),L=w=>w.map((x,j)=>({t:1+j*8,x})),
 l1=L(['root@kracker:~# sing along','bypassing the firewall','hold the note, build the combo','access granted!']),l2=L(['la la la (harmony)','ooh ooh (backup)','hold it, hold it','yeah!']);
 await db('put',{id:'d'+Date.now(),name:'Demo Solo',kind:'solo',audio:null,tr:[{n:A,l:l1}]});
 await db('put',{id:'e'+Date.now(),name:'Demo Duo',kind:'duo',audio:null,tr:[{n:A,l:l1},{n:A.map(n=>({...n,m:n.m+4})),l:l2}]});lib=await db('getAll');library()}
const LYT=k=>NY+24+k*46,rr=(x,a,b,w,h,r)=>{r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
let pt=0,pp=null;const nd=tr=>tr.l.sort((a,b)=>a.t-b.t).forEach((l,i,a)=>{if(!l.d)l.d=Math.max(.3,Math.min(3,a[i+1]?a[i+1].t-l.t:2))}),movePh=()=>{selStat();const h=$('#ph');if(h)h.style.left=pt*PPS+'px'};
let pvA=null,pvG=null;
function blip(m){if(pp)return;try{pvA=pvA||new AudioContext();pvA.resume();const t=pvA.currentTime;
 if(pvG){pvG.gain.cancelScheduledValues(t);pvG.gain.setTargetAtTime(0,t,.015)}
 const o=pvA.createOscillator(),g=pvA.createGain();o.type='triangle';o.frequency.value=440*2**((m-69)/12);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14,t+.02);g.gain.setValueAtTime(.14,t+.4);g.gain.linearRampToValueAtTime(0,t+.6);
 o.connect(g).connect(pvA.destination);o.start(t);o.stop(t+.65);pvG=g}catch(_){}}
async function play(rec,only){if(pp)return stopPlay();let st=null;
 if(rec)try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(x){return alert('Mic unavailable: '+(x.name||x))}
 const ac=new AudioContext(),os=[],t0=ac.currentTime+.1,hn=only||$('#hn').checked,ao=cur.ao||0;let an,bf;
 if(rec){an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(st).connect(an);bf=new Float32Array(2048)}
 if(hn)cur.tr.forEach((tr,k)=>{if(rec&&k==ct)return;tr.n.forEach(n=>{if(n.s+n.d<=pt)return;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=440*2**((n.m-69)/12);g.gain.value=.08;o.connect(g).connect(ac.destination);o.start(t0+Math.max(0,n.s-pt));o.stop(t0+n.s+n.d-pt);os.push(o)})});
 let au=null;if(cur.audio&&!only){au=new Audio(URL.createObjectURL(cur.audio));const at=pt-ao;if(at>=0)au.currentTime=at;setTimeout(()=>pp&&au.play(),100+Math.max(0,-at)*1000)}
 pp={ac,os,au,st,t0,p0:pt,rec:rec?{p:[]}:null};const end=Math.max(1,...cur.tr.flatMap(t=>t.n.map(n=>n.s+n.d)))+1,sc=$('#sc');$(only?'#pn':'#pb').textContent='■ STOP';if(rec)$('#rb').textContent='■ STOP REC';
 const f=()=>{if(!pp)return;const t=pp.p0+ac.currentTime-pp.t0;pt=Math.max(pp.p0,t);movePh();
  if(pp.rec){const i=Math.floor((pt-pp.p0)/.05);while(pp.rec.p.length<=i){an.getFloatTimeDomainData(bf);pp.rec.p.push(pitch(bf,ac.sampleRate))}}
  if(pt*PPS>sc.scrollLeft+sc.clientWidth-60||pt*PPS<sc.scrollLeft)sc.scrollLeft=pt*PPS-80;if(!pp.rec&&t>end)return stopPlay();pp.raf=requestAnimationFrame(f)};f()}
function stopPlay(){if(!pp)return;const r=pp.rec;
 if(r){const tr=cur.tr[ct],a=pp.p0,z=pt,nn=toNotes(r.p,a);tr.n=tr.n.filter(n=>n.s+n.d<=a||n.s>=z).concat(nn);en.clear()}
 pp.os.forEach(o=>{try{o.stop()}catch(_){}});if(pp.au)pp.au.pause();if(pp.st)pp.st.getTracks().forEach(t=>t.stop());cancelAnimationFrame(pp.raf);pp.ac.close();pp=null;
 const b=$('#pb'),c=$('#rb'),d=$('#pn');if(b)b.textContent='▶ PLAY';if(c)c.textContent='● REC';if(d)d.textContent='♪ NOTES ONLY';eDraw()}
function setCt(k){ct=k;en.clear();lsel.clear();app.querySelectorAll('[data-ct]').forEach(x=>x.classList.toggle('on',+x.dataset.ct==ct));eDraw()}
let xclip=null;
const msg=t=>{const m=$('#smg');if(m)m.textContent=t},
 cnt=(a,b)=>[a&&a+' note'+(a>1?'s':''),b&&b+' lyric block'+(b>1?'s':'')].filter(Boolean).join(' + ');
function selStat(){const e=$('#sst');if(!e||!cur)return;const tr=cur.tr[ct],a=[...en].filter(n=>tr.n.includes(n)).length,b=[...lsel].filter(l=>tr.l.includes(l)).length;
 e.textContent='Selected: '+(cnt(a,b)||'nothing')+'   |   Clipboard: '+((xclip&&cnt(xclip.n.length,xclip.l.length))||'empty')+'   |   Playhead: '+pt.toFixed(2)+'s'}
function selAll(){const tr=cur.tr[ct];tr.n.forEach(n=>en.add(n));tr.l.forEach(l=>lsel.add(l));eDraw()}
function delSel(){const tr=cur.tr[ct],a=tr.n.filter(n=>en.has(n)).length,b=tr.l.filter(l=>lsel.has(l)).length;if(!a&&!b)return msg('nothing selected to delete');
 tr.n=tr.n.filter(n=>!en.has(n));tr.l=tr.l.filter(l=>!lsel.has(l));en.clear();lsel.clear();msg('deleted '+cnt(a,b));eDraw()}
function copySel(cut){
 const tr=cur.tr[ct],ns=[...en].filter(n=>tr.n.includes(n)),ls=[...lsel].filter(l=>tr.l.includes(l));
 if(!ns.length&&!ls.length)return msg('nothing selected: box-select notes or lyric blocks first (Ctrl+A = whole track)');
 const t0=Math.min(...ns.map(n=>n.s),...ls.map(l=>l.t));
 xclip={t0,n:ns.map(n=>({s:+(n.s-t0).toFixed(3),d:n.d,m:n.m})),l:ls.map(l=>({t:+(l.t-t0).toFixed(3),x:l.x,d:l.d}))};
 if(cut){tr.n=tr.n.filter(n=>!en.has(n));tr.l=tr.l.filter(l=>!lsel.has(l));en.clear();lsel.clear();eDraw()}
 msg((cut?'cut ':'copied ')+cnt(ns.length,ls.length))}
function pasteSel(same){
 if(!xclip)return msg('nothing to paste yet: copy something first');
 const tr=cur.tr[ct],off=same?xclip.t0:Math.round(pt*20)/20,
  nn=xclip.n.map(n=>({s:+Math.max(0,off+n.s).toFixed(2),d:n.d,m:Math.max(LO,Math.min(HI,n.m))})),

 en.clear();lsel.clear();nn.forEach(n=>en.add(n));ll.forEach(l=>lsel.add(l));
 const sc=$('#sc'),x0=Math.min(...nn.map(n=>n.s),...ll.map(l=>l.t))*PPS;if(sc&&(x0<sc.scrollLeft||x0>sc.scrollLeft+sc.clientWidth-80))sc.scrollLeft=Math.max(0,x0-100);
 msg('pasted '+cnt(nn.length,ll.length)+' into track '+(ct+1)+(same?' (same time)':' at playhead')+' - still selected, so you can drag or Delete them');eDraw()}

function edit(){stopPlay();pt=0;cur.tr.forEach(nd);ct=0;en.clear();lsel.clear();app.innerHTML=`<div class=w style="max-width:1300px"><div class=row><input id=nm style="max-width:300px"><b>${cur.kind.toUpperCase()}</b><button id=sv class=go>SAVE</button><button id=bk2>BACK TO LIBRARY</button><span id=ms class=d></span></div>

 <div class=row><b id=sst style="color:var(--fg)"></b></div><div class=row><span id=smg class=d></span><span class=d style="margin-left:auto">build ${BUILD}</span></div>
 <p class=d>To copy notes AND lyrics together: drag along the colored tab above a lyric lane (this selects every note and lyric block in that time range), or box-select notes and Shift-click/Shift-drag lyric blocks. Press COPY SELECTED, click the TRACK button you want to paste into, move the white playhead knob (or click the strip under the notes) to where the first item should land, then press PASTE SELECTED AT PLAYHEAD. PASTE SELECTED (SAME TIME) keeps the original timing instead.</p>

function phone(){app.innerHTML=`<div class=w><h1>JOIN</h1><input id=cd maxlength=4 placeholder="ROOM CODE" style="text-transform:uppercase;font-size:28px"><div class=row style="margin:8px 0">${[0,1,2,3].map(i=>`<button data-sl=${i} class="${i==slot?'on':''}" style="border-color:${C[i]}">P${i+1}</button>`).join('')}</div><button id=go2 class=go>CONNECT + MIC</button><p id=er class=e></p></div>`}
let micErr='',micTimer=null;
async function startMic(){const ac=new AudioContext();micErr='';
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'no mediaDevices, secure='+isSecureContext};
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await ac.resume();
  const an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(st).connect(an);const bf=new Float32Array(2048);clearInterval(micTimer);
  micTimer=setInterval(()=>{an.getFloatTimeDomainData(bf);pm=pitch(bf,ac.sampleRate)},60);return true}
 catch(x){micErr=(x&&(x.name||x.message))+' | policy allows mic: '+(document.featurePolicy&&document.featurePolicy.allowsFeature?document.featurePolicy.allowsFeature('microphone'):'unknown');return false}}
async function join(){const er=$('#er');code=$('#cd').value.toUpperCase();if(!window.mqtt)return er.textContent='MQTT library failed to load (internet needed)';
 const mic=await startMic();
 try{mc=await mq();await new Promise((ok,no)=>mc.subscribe(tp()+'/dn',e=>e?no(e):ok()))}catch(x){return er.textContent='Could not reach relay: '+(x&&x.message||x)}
 app.innerHTML=`<div class=w style="text-align:center"><h2 style="color:${C[slot]}">P${slot+1} :: ${code}</h2><div class=big id=nt>--</div><div id=cb class=d>waiting for host…</div><div class=d>PC: press 1 / 2 for abilities, 3 to ATTACK</div>
 <div style="display:flex;gap:6px;margin:14px 0 4px">${[0,1,2].map(i=>`<div style="flex:1;height:30px;border:1px solid ${C[slot]};position:relative"><i id=bs${i} style="position:absolute;left:0;top:0;bottom:0;width:0;background:${C[slot]};transition:width .2s linear"></i></div>`).join('')}</div>
 <div class=d>ATTACK BAR</div><button data-a=2 id=ab2 class=go style="padding:28px;font-size:22px;width:100%;margin:8px 0" disabled>ATTACK</button>
 <div style="display:flex;flex-direction:column">${['PITCH LENIENCY','FRENZY'].map((n,k)=>`<button data-a=${k} id=ab${k} style="padding:22px;font-size:18px">${n}</button>`).join('')}</div>
 ${mic?'':'<p class=e id=me>Mic failed: '+micErr+'</p><button id=rm>RETRY MIC</button><p class=d>Test slider:</p><input type=range id=sw min=40 max=84 step=.5 value=60>'}</div>`;
 if(!mic)$('#sw').oninput=e=>pm=+e.target.value;
 mc.on('close',()=>{$('#cb').textContent='DISCONNECTED (retrying)'});mc.on('message',(_,m)=>{let d;try{d=JSON.parse(m)}catch(_){return}if(d.t!='state')return;const c=d.c[slot];$('#cb').textContent=d.j[slot]?`COMBO ${c}`:'host sees you…';$('#nt').style.textShadow=d.o[slot]?'0 0 20px '+C[slot]:'none';
  const bv=d.b?d.b[slot]:0,sg=Math.min(BAR.segs,Math.floor(bv)),ak=$('#ab2');[0,1,2].forEach(i=>$('#bs'+i).style.width=Math.max(0,Math.min(1,bv-i))*100+'%');
  ak.disabled=!d.ph||sg<1;ak.textContent=sg?`ATTACK +${BAR.pay[sg]}%`:'ATTACK';
  [0,1].forEach(k=>{const b=$('#ab'+k),s=d.cd[slot][k];b.disabled=!d.ph||s>0;b.dataset.l=b.dataset.l||b.textContent;b.textContent=b.dataset.l+(s>0?` (${s}s)`:'')})});
 setInterval(()=>{mc.connected&&mc.publish(tp()+'/up',JSON.stringify({t:'pitch',i:slot,m:pm==null?null:Math.round(pm*10)/10}));$('#nt').textContent=pm==null?'--':N[((Math.round(pm)%12)+12)%12]},80)}
// ---- song export / import ----
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)}),
say=t=>{const e=$('#ims');if(e)e.textContent=t};
async function exportSongs(list,name){
 if(!list.length)return alert('No songs to export yet.');
 say('preparing file…');
 try{const out=[];for(const s of list){const{audio,...rest}=s;out.push({...rest,audio:audio?{name:audio.name||'melody',type:audio.type||'audio/mpeg',data:await b64(audio)}:null})}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'karaoke-kracker',v:1,songs:out})],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);say(`exported ${list.length} song${list.length>1?'s':''} ✔`)}
 catch(x){say('export failed: '+(x&&x.message||x))}}
// validate + rebuild one imported song (never trust the file: only known fields, finite numbers, safe id)
async function cleanSong(s){
 if(!s||typeof s!='object'||!['solo','duo'].includes(s.kind)||!Array.isArray(s.tr)||s.tr.length!=(s.kind=='solo'?1:2))return null;
 const F=Number.isFinite,tr=s.tr.map(t=>({
  n:(t&&Array.isArray(t.n)?t.n:[]).filter(n=>n&&F(n.s)&&F(n.d)&&F(n.m)&&n.d>0).map(n=>({s:n.s,d:n.d,m:n.m})),
  l:(t&&Array.isArray(t.l)?t.l:[]).filter(l=>l&&F(l.t)&&typeof l.x=='string').map(l=>({t:l.t,x:l.x.slice(0,200),...(F(l.d)&&l.d>0?{d:l.d}:{})}))}));
 let audio=null;
 if(s.audio&&typeof s.audio.data=='string'&&s.audio.data.startsWith('data:')){const b=await(await fetch(s.audio.data)).blob();audio=new File([b],String(s.audio.name||'melody').slice(0,120),{type:/^audio\//.test(s.audio.type)?s.audio.type:(b.type||'audio/mpeg')})}
 return{id:typeof s.id=='string'&&/^[\w-]{1,40}$/.test(s.id)?s.id:'i'+Date.now()+Math.random().toString(36).slice(2,6),name:String(s.name||'Untitled').slice(0,100),kind:s.kind,audio,ao:F(s.ao)?s.ao:0,tr}}
async function importSongs(f){
 say('reading…');
 try{let j;try{j=JSON.parse(await f.text())}catch(_){throw new Error("that file isn't valid JSON")}
  const raw=Array.isArray(j)?j:j&&j.app=='karaoke-kracker'&&Array.isArray(j.songs)?j.songs:null;
  if(!raw)throw new Error("that isn't a Karaoke Kracker song file");
  const songs=[];for(const r of raw){const c=await cleanSong(r);if(c)songs.push(c)}
  if(!songs.length)throw new Error('no valid songs found in that file');
  const have=new Set(lib.map(s=>s.id)),dup=songs.filter(s=>have.has(s.id)).length;
  const replace=dup?confirm(`${dup} of ${songs.length} song(s) in this file already exist here.\n\nOK = replace them with the imported versions\nCancel = keep both (imported ones become copies)`):false;
  let k=0;for(const s of songs){if(have.has(s.id)&&!replace){s.id='i'+Date.now()+'_'+k;s.name=s.name+' (copy)'}k++;await db('put',s)}
  lib=await db('getAll');library();say(`imported ${songs.length} song${songs.length>1?'s':''} ✔`)}
 catch(x){say('import failed: '+(x&&x.message||x))}}
// ---- events ----
app.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset,i=b.id,ld=async()=>lib=await db('getAll');
 if(i=='hh')host();else if(i=='pp')phone();else if(D.m){mode=D.m;setup()}else if(i=='le')library();else if(i=='bk')setup();
 else if(D.new){cur={id:'s'+Date.now(),name:'Untitled',kind:D.new,audio:null,tr:D.new=='solo'?[{n:[],l:[]}]:[{n:[],l:[]},{n:[],l:[]}]};edit()}
 else if(D.ed){cur=structuredClone(lib.find(s=>s.id==D.ed));edit()}
 else if(D.rm){if(confirm('Delete this song?')){await db('delete',D.rm);await ld();library()}}
 else if(i=='exa')exportSongs(lib,'karaoke-kracker-songs-'+new Date().toISOString().slice(0,10)+'.json');else if(D.ex){const s=lib.find(s=>s.id==D.ex);if(s)exportSongs([s],(s.name.replace(/[^\w\- ]+/g,'').trim()||'song')+'.json')}else if(i=='imb')$('#im').click();
 else if(i=='dm')demo();else if(i=='sv'){await db('put',cur);await ld();$('#ms').textContent='saved ✔'}else if(i=='bk2'){stopPlay();await ld();library()}else if(i=='pb'){play();b.blur()}else if(i=='pn'){play(false,true);b.blur()}else if(i=='rb'){play(true);b.blur()}else if(D.ts){const tr=cur.tr[ct],mn=Math.min(...tr.n.map(n=>n.s),...tr.l.map(l=>l.t)),d=Math.max(+D.ts,-mn);tr.n.forEach(n=>n.s=+(n.s+d).toFixed(2));tr.l.forEach(l=>l.t=+(l.t+d).toFixed(2));eDraw()}else if(i=='z0'){pt=0;movePh();$('#sc').scrollLeft=0}
 else if(i=='cp'){copySel();b.blur()}else if(i=='cx'){copySel(true);b.blur()}else if(i=='pa'){pasteSel(false);b.blur()}else if(i=='pi'){pasteSel(true);b.blur()}else if(i=='sela'){selAll();b.blur()}else if(i=='seld'){en.clear();lsel.clear();eDraw();b.blur()}else if(i=='delsel'){delSel();b.blur()}
 else if(D.ct!=null)setCt(+D.ct)
 else if(D.tr){cur.tr[ct].n.forEach(n=>n.m=Math.max(LO,Math.min(HI,n.m+ +D.tr)));eDraw()}
 else if(i=='st')begin();else if(i=='go2')join();else if(i=='rm')startMic().then(ok=>{$('#me').textContent=ok?'Mic on ✔':'Mic failed: '+micErr});
 else if(D.sl!=null){slot=+D.sl;app.querySelectorAll('[data-sl]').forEach(x=>x.classList.toggle('on',+x.dataset.sl==slot))}
 else if(D.a!=null)mc&&mc.publish(tp()+'/up',JSON.stringify({t:'act',i:slot,k:+D.a}))};
app.onchange=e=>{const t=e.target,f=t.files&&t.files[0];
 if(t.dataset.sel)sel[t.dataset.sel]=t.value;else if(t.id=='sx')strict=t.checked;else if(t.id=='lp'){if(t.value.trim()){lsel.clear();cur.tr[ct].l=lrcP(t.value);nd(cur.tr[ct]);t.value='';eDraw()}}
 else if(t.id=='ao')cur.ao=+t.value||0;else if(f&&t.id=='au')cur.audio=f;else if(f&&t.id=='iv')an(f);else if(f&&t.id=='im'){importSongs(f);t.value=''}};
app.oninput=e=>{const t=e.target;if(t.id=='tl'){tol=+t.value;$('#tv').textContent=tol}else if(t.id=='gr'){grace=+t.value;$('#gv').textContent=grace}else if(t.id=='nm')cur.name=t.value;else if(t.dataset.oc){const[w,k]=t.dataset.oc.split(',');oc[w][+k]=+t.value;t.parentElement.querySelector('b').textContent=fo(+t.value)}};
onkeydown=e=>{const a=document.activeElement.tagName;if(a=='INPUT'||a=='TEXTAREA'||a=='SELECT')return;
 if($('#tc')&&cur&&(en.size||lsel.size)&&['Delete','Backspace','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const tr=cur.tr[ct],k=e.key,sh=e.shiftKey;
  if(k=='Delete'||k=='Backspace'){tr.n=tr.n.filter(n=>!en.has(n));tr.l=tr.l.filter(l=>!lsel.has(l));en.clear();lsel.clear()}
  else if(k[5]=='U'||k[5]=='D'){if(en.size){const d=(k[5]=='U'?1:-1)*(sh?12:1),a=[...en].map(n=>n.m+d);if(Math.min(...a)>=LO&&Math.max(...a)<=HI)en.forEach(n=>n.m+=d)}}
  else{const m=Math.min(...[...en].map(n=>n.s),...[...lsel].map(l=>l.t)),d=Math.max((k[5]=='R'?1:-1)*(sh?.5:.05),-m);en.forEach(n=>n.s=+(n.s+d).toFixed(2));lsel.forEach(l=>l.t=+(l.t+d).toFixed(2))}eDraw()}
 else if((e.ctrlKey||e.metaKey)&&e.key=='a'&&$('#tc')){e.preventDefault();cur.tr[ct].n.forEach(n=>en.add(n));cur.tr[ct].l.forEach(l=>lsel.add(l));eDraw()}
 else if((e.ctrlKey||e.metaKey)&&e.key.length==1&&'cxv'.includes(e.key.toLowerCase())&&$('#tc')){e.preventDefault();const k=e.key.toLowerCase();if(k=='v')pasteSel(e.shiftKey);else copySel(k=='x')}
 else if(e.key=='Enter'&&$('#tc')&&lsel.size==1&&!en.size){e.preventDefault();editLyric(cur.tr[ct],[...lsel][0])}
 else if(e.key==' '&&$('#pb')){e.preventDefault();document.activeElement.blur();play()}
 else if((e.key==' '||e.key=='Enter')&&$('#ov').style.display=='flex'){e.preventDefault();$('#ovb').click()}
 else if('123'.includes(e.key)&&$('#ab0'))$('#ab'+(e.key-1)).click();
 else if(e.key=='f'&&G)document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
